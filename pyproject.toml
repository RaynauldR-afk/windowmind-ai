[project]
name = "windowmind-ai"
version = "1.0.0"
description = "A sliding-window context engineering and conversational memory system powered by Ollama, LangChain, and LangGraph."
requires-python = ">=3.11"
dependencies = [
  "langchain>=1.0,<2.0",
  "langchain-core>=1.2,<2.0",
  "langchain-ollama>=1.1,<2.0",
  "langchain-text-splitters>=1.0,<2.0",
  "langgraph>=1.0,<2.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "python-dotenv>=1.0,<2.0",
  "rich>=13.9,<15.0",
  "psutil>=6.0,<8.0",
  "pytest>=8.0,<10.0",
]
[project.optional-dependencies]
dev = ["ruff>=0.9", "mypy>=1.14"]
[project.scripts]
windowmind = "windowmind.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/windowmind"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
